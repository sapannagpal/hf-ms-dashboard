server:
  port: 8082

spring:
  application:
    name: hf-ms-dashboard
  security:
    user:
      name: disabled

jwt:
  jwks-uri: ${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  issuer: ${JWT_ISSUER:https://api.healthplatform.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

workout:
  service-url: http://localhost:8083

logging:
  level:
    com.habfitt.dashboard: INFO
    org.springframework.security: WARN
